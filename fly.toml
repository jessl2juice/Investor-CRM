# BetterMind CRM - Fly.io Configuration
# Deploy: fly deploy -a bettermind-crm-api

app = "bettermind-crm-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PORT = "8080"
  ALLOWED_ORIGINS = "https://bettermind.buzz,https://bettermind-crm.pages.dev,http://localhost:5173,http://localhost:8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
